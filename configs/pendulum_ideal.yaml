# Task 2: Ideal Pendulum
# 论文 Section 4.2, Figure 2
# 哈密顿量: H = 2*m*g*l*(1 - cos(q)) + l^2 * p^2 / (2*m)

# Physics parameters
physics:
  m: 1.0          # 质量
  l: 1.0          # 摆长
  g: 3.0          # 重力加速度 (论文使用 g=3)

# Data generation
data:
  n_trajectories: 25
  n_observations: 30
  energy_range: [1.3, 2.3]  # 论文: 能量在 [1.3, 2.3] 范围内均匀采样
  noise_std: 0.1
  dt: 0.1
  t_max: 3.0

# Model architecture
model:
  input_dim: 2              # (q, p)
  hidden_dim: 200
  n_layers: 3
  activation: tanh
  output_dim: 1

# Training
training:
  learning_rate: 1.0e-3
  optimizer: adam
  batch_size: 64
  n_epochs: 2000
  seed: 42

# Evaluation
evaluation:
  rollout_steps: 200
  integrator: RK45
  rtol: 1.0e-9
  atol: 1.0e-9
